<!DOCTYPE html>
<html>
<head>
    <title>Semantic Search System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 2rem; }
        table { font-size: 0.9rem; }
    </style>
</head>
<body>
    <h2>Customer Complaint Viewer</h2>

    <form method="POST">
        <button name="load" type="submit" class="btn btn-primary">🔄 Load Data</button>
        <button name="embed" type="submit" class="btn btn-success">✨ Embed Data</button>
    </form>

    <hr>
    {% if table %}
        {{ table|safe }}
    {% else %}
        <p class="text-muted">No data loaded yet. Click “Load Data” to begin.</p>
    {% endif %}
</body>
</html>
