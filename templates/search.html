<!DOCTYPE html>
<html>
<head>
    <title>Search Complaints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { padding: 2rem; } </style>
</head>
<body>
    <h2>🔍 Search Customer Complaints</h2>

    <form method="POST" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Type your search..." value="{{ query }}">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    {% if table %}
        {{ table|safe }}
    {% elif query %}
        <p class="text-muted">No results found for "{{ query }}".</p>
    {% else %}
        <p class="text-muted">Enter a query above to begin searching.</p>
    {% endif %}

    <hr>
    <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">⚙️ Go to Admin Page</a>
</body>
</html>
